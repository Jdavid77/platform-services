apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: kube-prometheus-stack
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: kube-prometheus-stack
        namespace: flux-system
      spec:
        interval: 5m
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy
        ref:
          tag: << inputs.version >>
        url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-prometheus-stack
        namespace: flux-system
      spec:
        interval: 15m
        timeout: 5m
        maxHistory: 2
        chartRef:
          kind: OCIRepository
          name: kube-prometheus-stack
          namespace: flux-system
        targetNamespace: monitoring
        install:
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          crds:
            enabled: true
          cleanPrometheusOperatorObjectNames: true
          alertmanager:
            route:
              main:
                enabled: true
                hostnames:
                  - alerts.<< inputs.domain >>
                parentRefs:
                  - name: gateway
                    namespace: istio-system
                    sectionName: https
                matches:
                  - path:
                      type: PathPrefix
                      value: /
            alertmanagerSpec:
              replicas: 1
              storage:
                volumeClaimTemplate:
                  spec:
                    resources:
                      requests:
                        storage: 1Gi
              secrets:
                - discord-webhook
            config:
              route:
                receiver: discord
                group_by: ["alertname"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
              receivers:
                - name: discord
                  discord_configs:
                    - webhook_url_file: /etc/alertmanager/secrets/discord-webhook/webhookURL
          kubelet:
            enabled: true
            serviceMonitor:
              metricRelabelings:
                - action: labeldrop
                  regex: (uid)
                - action: labeldrop
                  regex: (id|name)
                - action: drop
                  sourceLabels: ["__name__"]
                  regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
          kubeApiServer:
            enabled: true
            serviceMonitor:
              metricRelabelings:
                - action: drop
                  sourceLabels: ["__name__"]
                  regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
                - action: drop
                  sourceLabels: ["__name__"]
                  regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)
          kubeControllerManager:
            enabled: false
          kubeEtcd:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeProxy:
            enabled: false
          prometheusOperator:
            prometheusConfigReloader:
              resources:
                requests:
                  cpu: 100m
                  memory: 50Mi
                limits:
                  cpu: 300m
                  memory: 100Mi
          prometheus:
            route:
              main:
                enabled: true
                hostnames:
                  - prometheus.<< inputs.domain >>
                parentRefs:
                  - name: gateway
                    namespace: istio-system
                    sectionName: https
                matches:
                  - path:
                      type: PathPrefix
                      value: /
            thanosService:
              enabled: false
            thanosServiceMonitor:
              enabled: false
            prometheusSpec:
              replicas: 1
              replicaExternalLabelName: __replica__
              scrapeInterval: 1m # Must match interval in Grafana Helm chart
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              probeSelectorNilUsesHelmValues: false
              scrapeConfigSelectorNilUsesHelmValues: false
              enableRemoteWriteReceiver: true
              enableAdminAPI: true
              walCompression: true
              enableFeatures:
                - auto-gomemlimit
                - memory-snapshot-on-shutdown
                - new-service-discovery-manager
              retention: 1d
              retentionSize: 9GB
              externalLabels:
                cluster: main
              resources:
                requests:
                  cpu: 500m
                limits:
                  memory: 4Gi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    resources:
                      requests:
                        storage: 10Gi
          nodeExporter:
            enabled: true
          prometheus-node-exporter:
            resources:
              requests:
                cpu: 23m
                memory: 64M
              limits:
                memory: 64M
            fullnameOverride: node-exporter
            prometheus:
              monitor:
                enabled: true
                relabelings:
                  - action: replace
                    regex: (.*)
                    replacement: $1
                    sourceLabels: ["__meta_kubernetes_pod_node_name"]
                    targetLabel: node
          kubeStateMetrics:
            enabled: false
          grafana:
            enabled: false
            defaultDashboardsEnabled: false
