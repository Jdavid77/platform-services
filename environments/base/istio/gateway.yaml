apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: istio-gateway
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: istio
      namespace: flux-system
      ready: true
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: cert-manager-ca-issuer
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-tls
        namespace: istio-system
      spec:
        secretName: wildcard-tls
        duration: 2160h # 90 days
        renewBefore: 360h # 15 days
        commonName: "platform-sandbox.com"
        dnsNames:
          - "platform-sandbox.com"
          - "*.platform-sandbox.com"
        issuerRef:
          name: ca-issuer
          kind: ClusterIssuer
    - apiVersion: networking.istio.io/v1
      kind: Gateway
      metadata:
        name: gateway
        namespace: istio-system
      spec:
        selector:
          istio: ingressgateway
        servers:
        - port:
            number: 443
            name: https
            protocol: HTTPS
          tls:
            mode: SIMPLE
            credentialName: wildcard-tls
          hosts:
          - "*.platform-sandbox.com"
