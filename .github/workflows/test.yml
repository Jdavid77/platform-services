name: Test Flux Resources
permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test Flux Resources
    runs-on: ubuntu-slim
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run flate test
        run: mise exec -- flate test all --path ./environments | tee test