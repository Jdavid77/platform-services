name: Validate

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]

jobs:
  conftest:
    name: Validate OPA Policies
    runs-on: ubuntu-slim
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run conftest
        run: mise exec -- conftest test environments/ -p policy/

  flux:
    name: Validate Flux Resources
    runs-on: ubuntu-slim
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run flate test
        run: mise exec -- flate test all --path ./environments | tee test
